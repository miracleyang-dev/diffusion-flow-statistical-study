[project]
name = "diffusion-flow-statistical-study"
version = "0.1.0"
description = "A controlled statistical comparison of DDPM, Score-SDE, and Flow Matching."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "torch>=2.2",
]

[project.scripts]
diffusion-flow-study = "diffusion_flow_study.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_flow_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
